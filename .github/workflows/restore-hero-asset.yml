name: Restore hero asset
on:
  push:
    branches: [main]
    paths:
      - '.hero/bitmate-hero-visual.part0'
      - '.hero/bitmate-hero-visual.part1'
      - '.hero/bitmate-hero-visual.part2'
      - '.hero/bitmate-hero-visual.part3'
      - '.hero/bitmate-hero-visual.part4'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore BITMATE hero image
        shell: bash
        run: |
          for n in 0 1 2 3 4; do test -f ".hero/bitmate-hero-visual.part$n"; done
          cat .hero/bitmate-hero-visual.part{0,1,2,3,4} | base64 -d > public/assets/bitmate-hero-visual.webp
          test "$(wc -c < public/assets/bitmate-hero-visual.webp)" -eq 25108
          test "$(git hash-object public/assets/bitmate-hero-visual.webp)" = "82fc2c88e085480f2de5733f4d487fcded5245db"
      - name: Commit restored asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/bitmate-hero-visual.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore complete BITMATE hero visual"
          git push
