name: BITMATE Native Build

on:
  push:
    branches:
      - mobile-capacitor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-native:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-capacitor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Install image processor for official PNG native assets
        run: npm install --no-save --no-audit --no-fund sharp
      - name: Generate native projects
        shell: bash
        run: |
          test -d android || npx cap add android
          test -d ios || npx cap add ios
          npx cap sync
          node scripts/prepare-capacitor-native.mjs
          npx @capacitor/assets generate --iconBackgroundColor '#090B0D' --iconBackgroundColorDark '#090B0D' --splashBackgroundColor '#090B0D' --splashBackgroundColorDark '#090B0D'
      - name: Commit generated Android and iOS projects
        if: ${{ !contains(github.event.head_commit.message || '', '[native-generated]') }}
        shell: bash
        run: |
          git config user.name "BITMATE Native CI"
          git config user.email "actions@users.noreply.github.com"
          git add android ios
          if git diff --cached --quiet; then
            echo "Native projects already synchronized."
          else
            git commit -m "[native-generated] Sync Capacitor Android and iOS projects"
            git push origin HEAD:mobile-capacitor
          fi

  web-build:
    needs: bootstrap-native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-capacitor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  android-build:
    needs: bootstrap-native
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-capacitor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npx cap sync android
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bitmate-android-debug-apk-internal-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Configure official release signing
        shell: bash
        env:
          BITMATE_RELEASE_KEYSTORE_BASE64: ${{ secrets.BITMATE_RELEASE_KEYSTORE_BASE64 }}
          BITMATE_RELEASE_STORE_PASSWORD: ${{ secrets.BITMATE_RELEASE_STORE_PASSWORD }}
          BITMATE_RELEASE_KEY_ALIAS: ${{ secrets.BITMATE_RELEASE_KEY_ALIAS }}
          BITMATE_RELEASE_KEY_PASSWORD: ${{ secrets.BITMATE_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$BITMATE_RELEASE_KEYSTORE_BASE64" ] || [ -z "$BITMATE_RELEASE_STORE_PASSWORD" ] || [ -z "$BITMATE_RELEASE_KEY_ALIAS" ] || [ -z "$BITMATE_RELEASE_KEY_PASSWORD" ]; then
            echo 'Release signing credentials not configured; no APK will be published.'
            exit 0
          fi
          echo "$BITMATE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bitmate-release.jks"
          echo "BITMATE_SIGNING_READY=true" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.BITMATE_SIGNING_READY == 'true' }}
        working-directory: android
        env:
          BITMATE_KEYSTORE_FILE: ${{ runner.temp }}/bitmate-release.jks
          BITMATE_STORE_PASSWORD: ${{ secrets.BITMATE_RELEASE_STORE_PASSWORD }}
          BITMATE_KEY_ALIAS: ${{ secrets.BITMATE_RELEASE_KEY_ALIAS }}
          BITMATE_KEY_PASSWORD: ${{ secrets.BITMATE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Publish signed APK only to website
        if: ${{ env.BITMATE_SIGNING_READY == 'true' }}
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/bitmate-latest.apk"
          git config user.name "BITMATE Native CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-apk origin/main
          mkdir -p public/downloads
          cp "$RUNNER_TEMP/bitmate-latest.apk" public/downloads/bitmate-latest.apk
          sha256sum public/downloads/bitmate-latest.apk | awk '{print $1}' > public/downloads/bitmate-latest.apk.sha256
          git add -f public/downloads/bitmate-latest.apk
          git add public/downloads/bitmate-latest.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "[native-apk] Publish signed Android APK"
            git push origin HEAD:main
          fi

  ios-build:
    needs: bootstrap-native
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-capacitor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx cap sync ios
      - name: Build iOS simulator without signing
        shell: bash
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
