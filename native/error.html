<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0b0c0e"/>
  <title>BITMATE · Offline</title>
  <style>
    :root{color-scheme:dark}
    html,body{height:100%;margin:0;background:#0b0c0e;color:#f4f7f8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(420px,100%);text-align:center}
    .logo{width:78px;height:78px;margin:0 auto 18px;border-radius:20px;background:#a8f000;color:#0b0c0e;display:grid;place-items:center;font-weight:950;font-size:40px}
    h1{font-size:22px;margin:0 0 10px}
    p{color:#8f9aa0;font-size:14px;line-height:1.6;margin:0 0 20px}
    button{width:100%;height:48px;border:0;border-radius:10px;background:#a8f000;color:#0b0c0e;font-weight:900;font-size:14px}
  </style>
</head>
<body>
<main>
  <div class="logo">B</div>
  <h1>네트워크 연결을 확인해주세요.</h1>
  <p>인터넷 연결이 복구되면 다시 시도할 수 있습니다. 거래 요청 중 연결이 끊겼다면 서버 결과를 확인한 뒤 다시 진행해주세요.</p>
  <button onclick="location.href='https://bitmates.vercel.app/'">다시 연결</button>
</main>
</body>
</html>
